
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       8080;
        server_name  localhost;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }

    server {
        # 监听一个新的端口，比如 8081，避免和默认的 8080 冲突
        listen 8081;
        server_name localhost;

        # 瓦片服务的日志，如果需要调试可以取消注释
        # access_log /opt/homebrew/var/log/nginx/map-tiles.access.log;
        # error_log /opt/homebrew/var/log/nginx/map-tiles.error.log;

        # 匹配前端请求的 URL 路径
        location /offline_map_tiles/ {
            # 使用 alias 指向你下载的瓦片文件夹
            # 注意：这里的路径 /Users/zhanghq/Documents/map_tiles/ 最后需要有斜杠
            alias /Users/zhanghq/Documents/map_tiles/;

            # 添加 CORS 跨域头，允许你的 Web 应用（如 http://localhost:5173）访问
            add_header 'Access-Control-Allow-Origin' '*' always;

            # 为瓦片设置浏览器缓存，提高性能
            expires 1d;
        }
    }

    # another virtual host using mix of IP-, name-, and port-based configuration
