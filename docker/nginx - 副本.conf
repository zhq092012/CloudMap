#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;
events {
    worker_connections 1024;
}


http {
    include mime.types;
    default_type application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;
    sendfile on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout 65;

    #gzip  on;

    server {
        listen 80;
        server_name localhost;

        root D:/schoolProject/gitee/satellite_vue/docker/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://192.168.52.72:34126/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
        }

        location /media/ {
            proxy_pass http://localhost:31280/; # 或其他本地 material 服务地址
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            add_header Access-Control-Allow-Origin *;
        }

        location /image/ {
            proxy_pass http://192.168.100.21:31298/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            add_header Access-Control-Allow-Origin *;
        }
    }

    server {
        listen 31280;
        server_name localhost;

        location / {
            alias C:/Users/11690/Documents/material/earth/saveFile/;
            autoindex off;
            add_header Access-Control-Allow-Origin *;
        }

        location /media/ {
            alias C:/Users/11690/Documents/material/earth/saveFile/;
            autoindex off;
            add_header Access-Control-Allow-Origin *;
        }
    }
    server {
        listen 31285;
        server_name localhost;

        location / {
            alias C:/Users/11690/Documents/material/map_tiles/map_tiles/;
            autoindex off;
            add_header Access-Control-Allow-Origin *;
        }


    }

